<section class="live-game">
  <header class="game-scorebar" aria-label="Game score">
    <div class="game-teams">
      <span><span data-bind="home-team"></span> <strong data-bind="home-score"></strong></span>
      <span><span data-bind="away-team"></span> <strong data-bind="away-score"></strong></span>
    </div>
    <div class="game-clock"><span data-bind="quarter"></span><span id="game-clock"></span></div>
  </header>
  <canvas id="game-canvas" class="game-canvas" width="960" height="540" tabindex="0" aria-label="Horizontal football field. Press space to snap. Press 1 through 5 or click the field to throw to a spot, or press space again to run using W, A, S and D."></canvas>
  <div id="play-select-overlay" class="play-select-overlay">
    <div class="play-select-header">
      <span class="play-select-title">CALL PLAY</span>
      <span class="play-select-hint">1, 2, 3 or Click &bull; Space to snap</span>
    </div>
    <div id="play-cards-row" class="play-cards-row"></div>
  </div>
</section>
