<section class="roster-screen">
  <header class="roster-header">
    <div><span class="roster-kicker" data-bind="team-title"></span><h2>ROSTER</h2></div>
  </header>
  <div class="roster-toolbar"><div class="roster-tabs"><button data-action="roster-group" data-group="offense">OFFENSE</button><button data-action="roster-group" data-group="defense">DEFENSE</button></div><span data-bind="player-count"></span></div>
  <div class="player-grid" data-bind="player-grid"><p class="empty" data-bind="empty-roster" hidden>No players on the roster yet.</p></div>
  <template data-template="player-card">
    <button class="player-card" data-action="player">
      <span class="player-card-top"><span class="player-card-rating-badge" data-bind="overall"></span><span data-bind="portrait"></span></span>
      <span class="player-card-info"><span class="player-name" data-bind="name"></span><span class="player-card-position" data-bind="position"></span></span>
    </button>
  </template>
</section>
