<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Retro Bowl Animation Viewer</title>
  <style>
    body { margin: 0; background: #111827; color: #e5e7eb; font: 14px system-ui, sans-serif; }
    header { padding: 16px 20px; border-bottom: 1px solid #374151; }
    main { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 70px); }
    aside { padding: 14px; border-right: 1px solid #374151; overflow: auto; }
    button { display: block; width: 100%; margin: 0 0 7px; padding: 8px; text-align: left; color: #e5e7eb; background: #1f2937; border: 1px solid #4b5563; border-radius: 4px; cursor: pointer; }
    button.active, button:hover { background: #2563eb; }
    section { display: grid; place-items: center; padding: 24px; }
    #stage { width: 420px; height: 300px; display: grid; place-items: center; background: #26733b; border: 4px solid #d1d5db; image-rendering: pixelated; }
    #sprite { max-width: 90%; max-height: 90%; image-rendering: pixelated; transform: scale(5); }
    #meta { margin-top: 28px; text-align: center; color: #9ca3af; }
  </style>
</head>
<body>
  <header><strong>Animation Viewer</strong> — click an animation to preview its frames</header>
  <main>
    <aside id="buttons">Loading animations...</aside>
    <section>
      <div>
        <div id="stage"><img id="sprite" alt="Animation frame"></div>
        <div id="meta">No animation selected</div>
      </div>
    </section>
  </main>
  <script>
    const buttons = document.getElementById('buttons');
    const sprite = document.getElementById('sprite');
    const meta = document.getElementById('meta');
    let timer = null;

    function play(group, button) {
      clearInterval(timer);
      document.querySelectorAll('button').forEach(item => item.classList.remove('active'));
      button.classList.add('active');
      let frame = 0;
      const show = () => {
        const file = group.frames[frame % group.frames.length];
        sprite.src = `../public/images/actions/${encodeURIComponent(file)}`;
        meta.textContent = `${group.name} — ${frame % group.frames.length + 1}/${group.frames.length} — ${file}`;
        frame += 1;
      };
      show();
      timer = setInterval(show, 140);
    }

    fetch('animations.json')
      .then(response => response.json())
      .then(groups => {
        buttons.textContent = '';
        groups.forEach(group => {
          const button = document.createElement('button');
          button.textContent = `${group.name} (${group.frames.length})`;
          button.onclick = () => play(group, button);
          buttons.appendChild(button);
        });
        if (groups[0]) buttons.firstElementChild.click();
      })
      .catch(error => {
        buttons.textContent = `Could not load animations.json: ${error.message}. Run the manifest script first.`;
      });
  </script>
</body>
</html>
